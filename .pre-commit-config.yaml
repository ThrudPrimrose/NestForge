# Setup: pip install -e ".[dev]" && pre-commit install
# Every file: pre-commit run --all-files (CI runs the same)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: nestforge-headers
        name: copyright / SPDX header
        entry: python scripts/check_headers.py --fix
        language: system
        require_serial: true
        files: '\.py$'
      - id: nestforge-large-files
        name: block files > 500 KiB
        entry: python scripts/check_large_files.py
        language: system
