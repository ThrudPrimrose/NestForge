name: CI

# pip installs from pyproject.toml: dace tracks spcl/dace@extended, hpcagent_bench tracks
# spcl/HPCAgent-Bench@main. Must stay credential-free so CI runs on fork PRs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files --show-diff-on-failure
      # stage_labels exists only on dace@extended, so a stale or PyPI dace fails here.
      - name: dace is @extended
        run: python -c "from dace.transformation.passes.canonicalize import stage_labels; stage_labels()"
      - name: pytest (a skip fails the run)
        env:
          NESTFORGE_CI_NO_SKIP: '1'
        run: pytest -m "not integration and not gpu and not vendor" -n auto --timeout=900 --cov=nestforge --cov-report=term

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo bash scripts/setup_apt.sh
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: pytest
        run: pytest -m "integration and not gpu and not vendor" --timeout=900 --cov=nestforge --cov-report=term
