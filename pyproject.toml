[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-forge"
version = "0.0.1"
description = "Phased whole-program optimization of DaCe programs for deterministic, human and agent drivers."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "loop-nest", "code-generation", "compilers", "autotuning", "hpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy",
    "pyyaml",
    "sympy",
    # Branches, not pins: DaCe tracks extended, HPCAgent-Bench tracks main.
    "dace @ git+https://github.com/spcl/dace.git@extended",
    "hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@main",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    # Pinned to the pre-commit hook's rev: a new release widens the default rules.
    "ruff==0.15.10",
]

[project.urls]
Homepage = "https://github.com/spcl/NestForge"
Repository = "https://github.com/spcl/NestForge"

[tool.setuptools.packages.find]
include = ["nestforge*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Tests import after a module-level skip guard, use lambda helpers, and keep the reference's math names.
"tests/*" = ["E402", "E731", "E741"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "integration: compiles and runs kernels; slow, its own CI job",
    "e2e: end-to-end with g++/clang++, so it runs on CI",
    "gpu: needs a CUDA device, never on CI",
    "vendor: needs a vendor compiler or library not installed on CI",
]

[tool.coverage.run]
# Forked children leave through os._exit, which skips coverage's atexit save.
patch = ["_exit"]
parallel = true
